<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kylo — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(242,201,76,.12),transparent 35%),#080807;color:#fff;font-family:Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:24px;font-weight:800}.logo b{color:#f2c94c}.panel,.card{border:1px solid #282820;background:rgba(255,255,255,.025);border-radius:16px;padding:22px;margin-bottom:18px}h1{margin:0 0 8px;font-size:34px}h2{margin-top:0}label{display:block;color:#aaa;font-size:13px;margin:14px 0 7px}input,textarea,select{width:100%;background:#0e0e0c;border:1px solid #33332b;color:#fff;padding:12px;border-radius:9px;outline:none}textarea{min-height:95px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:1px solid #fff;background:#fff;color:#090909;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:#fff;border-color:#3a3a34}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.status{color:#f2c94c;font-size:13px}.project{display:flex;justify-content:space-between;gap:20px;align-items:center}.project h3{margin:0 0 5px}.muted{color:#888}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.project{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<div class="top"><div class="logo">Kylo<b>.</b> / Admin</div><a class="btn alt" href="/">View Site</a></div>
<div id="login" class="panel"><h1>Admin Login</h1><p class="muted">Enter the admin password configured on Railway.</p><input id="password" type="password" placeholder="Admin password"><div class="actions"><button class="btn" onclick="login()">Continue</button></div><p id="loginMsg" class="status"></p></div>
<div id="app" class="hidden">
<div class="panel"><h1>Projects</h1><p class="muted">Add, edit and remove projects without touching the code.</p>
<form id="form"><input type="hidden" id="id"><div class="grid"><div><label>Project name</label><input id="title" required></div><div><label>Category</label><select id="category"><option>Roblox</option><option>Discord</option><option>Web</option><option>Other</option></select></div></div>
<label>Description</label><textarea id="description" required></textarea><div class="grid"><div><label>Image URL</label><input id="image" placeholder="https://..."></div><div><label>Technologies (comma separated)</label><input id="technologies" placeholder="Node.js, Supabase"></div></div><div class="grid"><div><label>Demo URL</label><input id="demo_url" placeholder="https://..."></div><div><label>GitHub URL</label><input id="github_url" placeholder="https://github.com/..."></div></div><div class="grid"><div><label>Status</label><select id="status"><option>Live</option><option>In Development</option><option>Archived</option></select></div><div><label>Featured</label><select id="featured"><option value="false">No</option><option value="true">Yes</option></select></div></div><div class="actions"><button class="btn" type="submit">Save Project</button><button class="btn alt" type="button" onclick="resetForm()">Clear</button></div><p id="msg" class="status"></p></form></div>
<div id="list"></div></div></main>
<script>
let token=sessionStorage.getItem("kylo_admin");
const $=id=>document.getElementById(id);
function show(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");load(); }
if(token) show();
async function login(){const p=$("password").value;if(!p)return;$("loginMsg").textContent="Checking...";const r=await fetch("/api/projects",{headers:{Authorization:"Bearer "+p}});if(r.ok){token=p;sessionStorage.setItem("kylo_admin",p);show()}else $("loginMsg").textContent="Invalid password."}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(url,opts);if(r.status===401){sessionStorage.removeItem("kylo_admin");location.reload();}const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
async function load(){const r=await fetch("/api/projects");const data=await r.json();$("list").innerHTML=data.length?data.map(p=>'<div class="card project"><div><span class="status">'+p.status+(p.featured?' · Featured':'')+'</span><h3>'+esc(p.title)+'</h3><div class="muted">'+esc(p.category)+' · '+esc((p.technologies||[]).join(", "))+'</div></div><div class="actions"><button class="btn alt" onclick="edit('+p.id+')">Edit</button><button class="btn alt" onclick="del('+p.id+')">Delete</button></div></div>').join(""):'<div class="card muted">No projects yet.</div>'}
async function edit(id){const data=await (await fetch("/api/projects")).json();const p=data.find(x=>x.id==id);if(!p)return;$("id").value=p.id;$("title").value=p.title;$("description").value=p.description;$("category").value=p.category;$("image").value=p.image;$("technologies").value=(p.technologies||[]).join(", ");$("demo_url").value=p.demo_url;$("github_url").value=p.github_url;$("status").value=p.status;$("featured").value=String(p.featured);scrollTo({top:0,behavior:"smooth"})}
$("form").onsubmit=async e=>{e.preventDefault();const body={title:$("title").value,description:$("description").value,category:$("category").value,image:$("image").value,demo_url:$("demo_url").value,github_url:$("github_url").value,technologies:$("technologies").value.split(",").map(x=>x.trim()).filter(Boolean),status:$("status").value,featured:$("featured").value==="true"};try{if($("id").value)await api("/api/projects/"+$("id").value,{method:"PUT",body:JSON.stringify(body)});else await api("/api/projects",{method:"POST",body:JSON.stringify(body)});$("msg").textContent="Saved ✓";resetForm();load()}catch(e){$("msg").textContent=e.message}}
async function del(id){if(!confirm("Delete this project?"))return;try{await api("/api/projects/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}
function resetForm(){$("id").value="";$("form").reset();$("msg").textContent=""}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&#39;",""":"&quot;"}[c]))}
</script></body></html>
